<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Gestión GeoSoil ML 2.6.2</title><link rel="stylesheet" href="dashboard.css"><body><nav><h2>GeoSoil ML</h2><small>2.6.2</small><a href="dashboard.html">Panel principal</a><a href="manage.html" aria-current="page">Gestión de laboratorio</a><a href="lab.html">Mi cuenta</a></nav><main><h1>Gestión de laboratorio</h1><p id="status" role="status">Conectando…</p><aside>Los ejemplos son sintéticos. Los datos propios no están verificados. Clasificación preliminar de suelos minerales.</aside><fieldset id="workspace" disabled><article><h2>Proyecto</h2><form id="pf"><label>Proyecto existente<select id="project"></select></label><label>Nombre<input id="name" required></label><label>Origen<select id="origin"><option value="synthetic">Sintético</option><option value="user_unverified">Propio no verificado</option></select></label><div class="toolbar"><button>Guardar proyecto</button><button type="button" id="newp">Nuevo</button></div></form></article><article><h2>Calicata</h2><form id="ef"><label>Calicata existente<select id="exploration"></select></label><label>Código<input id="ecode" required></label><label>Profundidad (m)<input id="edepth" type="number" min=".01" step="any" required value="4"></label><div class="toolbar"><button>Guardar calicata</button><button type="button" id="newe">Nueva</button></div></form></article><article><h2>Muestra</h2><form id="sf"><label>Muestra existente<select id="sample"></select></label><label>Ejemplo sintético<select id="example"></select></label><button type="button" id="copy">Precargar ejemplo</button><label>Código<input id="scode" required></label><div class="toolbar"><label>Desde (m)<input id="from" type="number" min="0" step="any" required value="0"></label><label>Hasta (m)<input id="to" type="number" min=".01" step="any" required value=".8"></label></div><div id="fields" class="metrics"></div><label><span>No plástico</span><input id="np" type="checkbox"></label><p id="result"></p><div class="toolbar"><button type="button" id="calc">Clasificar</button><button>Guardar muestra</button><button type="button" id="news">Nueva</button></div></form></article></fieldset></main><script type="module" src="manage.mjs"></script></body></html>
